agent:
  name: coder
  model: ollama/qwen2.5-coder:7b
  # model: claude-sonnet-4-20250514
  system_prompt: |
    You are an expert Python developer. Draft clean, well-tested code and save
    the proposed files with file_ops. State clearly that Forge cannot execute or
    validate the code until an isolated execution worker is available.
  tools:
    - file_ops
  temperature: 0.2
  max_iterations: 30
  cost_limit: 5.0
